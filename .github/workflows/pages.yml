name: Build and Deploy Docs

on:
  push:
    branches:
      - main   # or whatever your default branch is
  workflow_dispatch:  # allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # or match your project

      - name: Install system dependencies
        # The docs build compiles the C++ extension (`pip install ".[dev]"`), so it
        # needs the same packages as build.yml: pybind11-dev for the
        # find_package(pybind11) cmake config, plus liblapack/libblas for the
        # quantum subsystem. Without them the build — and the whole deploy — fails.
        # pandoc generates the whitepaper's Markdown edition from its LaTeX source.
        run: sudo apt-get update && sudo apt-get install -y doxygen pandoc pybind11-dev liblapack-dev libblas-dev

      # Cheap and independent of the extension build, so it runs before it: the
      # Markdown edition of the whitepaper is generated from the LaTeX source,
      # and a hand-edit or an unregenerated revision would otherwise drift
      # silently. Regenerate with `python3 scripts/whitepaper_markdown.py`.
      - name: Check the whitepaper Markdown edition is current
        run: python3 scripts/whitepaper_markdown.py --check

      - name: Install dependencies
        run: |
           python -m pip install --upgrade pip
           pip install ".[dev]"
           pip install -r docs/requirements.txt

      # No pytest here: the suite exceeds the runner's time budget, so tests are
      # a local gate (see README). This workflow's job is to compile the
      # extension and build + deploy the docs — a green run asserts exactly that.
      - name: Build Sphinx HTML
        working-directory: docs
        run: |
          make html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

