[build-system]
requires = [
#    "cmake>=3.22",
#    "ninja",                # optional but faster on CI
    "pybind11>=3.0",
    "scikit-build-core>=0.9",
    "numpy>=2.3.4",
    "pybind11-stubgen==2.5.5"
]
build-backend = "scikit_build_core.build"

[project]
name = "tessera"
version = "0.1.0"
description = "C++/pybind11 extension for lattice spacetime experiments"
authors = [{ name = "Andrew Kelleher", email = "keats.kelleher@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.0",
]
optional-dependencies.examples = [
    "matplotlib>=3.8",
    "networkx>=3.0",
    "scipy>=1.11",
    "tqdm>=4.66",
]
optional-dependencies.dev = [
    "tessera[examples]",
    "pytest",
    "pytest-xdist",
    "scikit-build-core>=0.9",
    "cmake>=3.22",
    "ninja",
    "pybind11>=3.0",
    "pybind11-stubgen==2.5.5",
    "sphinx==8.2.3",
    "furo==2025.9.25",
    "myst_parser==4.0.1",
    "breathe==4.36.0",
    "sphinxcontrib-bibtex>=2.6,<3",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that take >30s (deselect with '-m \"not slow\"')",
]

[tool.scikit-build]
build-dir = "cmake-build-debug/{wheel_tag}"
# Default Release (-O3) — perf/compute. Fast dev compiles want Debug (-O1, ccache-friendly):
#   pip install -e ".[dev]" -C cmake.build-type=Debug
# but the Debug build currently aborts at `import tessera` (free(): invalid pointer) — a
# latent invalid-free that -O3 masks. Fix that before relying on the Debug dev build.
cmake.build-type = "Release"
wheel.packages = ["tessera"]
# Do NOT add a [tool.scikit-build.cmake.define] override for Python_EXECUTABLE.
# scikit-build-core already sets it (and CMAKE_PREFIX_PATH) to the build
# interpreter; cmake.define values are passed verbatim, so a "${...}" token
# is not interpolated — it lands in CMake as a literal bogus path and makes
# find_package(Python) fall back to the wrong interpreter.
