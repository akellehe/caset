[build-system]
requires = [
#    "cmake>=3.22",
#    "ninja",                # optional but faster on CI
    "pybind11>=3.0",
    "scikit-build-core>=0.9",
    "numpy>=2.3.4",
    "pybind11-stubgen==2.5.5"
]
build-backend = "scikit_build_core.build"

[project]
name = "tessera"
version = "0.1.0"
description = "C++/pybind11 extension for lattice spacetime experiments"
authors = [{ name = "Andrew Kelleher", email = "keats.kelleher@gmail.com" }]
readme = "README.md"
# Upper-bounded so Poetry can resolve dev deps that cap Python at <4.0 (e.g.
# pybind11-stubgen); pip resolves per-interpreter and is unaffected.
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
]
optional-dependencies.examples = [
    "matplotlib>=3.8",
    "networkx>=3.0",
    "scipy>=1.11",
    "tqdm>=4.66",
]
optional-dependencies.dev = [
    # The examples extra is inlined here (rather than referenced as
    # "tessera[examples]") so Poetry can resolve `poetry install --all-extras`:
    # Poetry 2.x rejects a PEP 621 self-referential extra as a self-dependency.
    # pip's resolved dependency set is unchanged. Keep in sync with the
    # optional-dependencies.examples list above.
    "matplotlib>=3.8",
    "networkx>=3.0",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pytest",
    "scikit-build-core>=0.9",
    "cmake>=3.22",
    "ninja",
    "pybind11>=3.0",
    "pybind11-stubgen==2.5.5",
    "sphinx==8.2.3",
    "furo==2025.9.25",
    "myst_parser==4.0.1",
    "breathe==4.36.0",
    "sphinxcontrib-bibtex>=2.6,<3",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that take >30s (deselect with '-m \"not slow\"')",
]

[tool.scikit-build]
build-dir = "cmake-build-debug/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["tessera"]
# Do NOT add a [tool.scikit-build.cmake.define] override for Python_EXECUTABLE.
# scikit-build-core already sets it (and CMAKE_PREFIX_PATH) to the build
# interpreter; cmake.define values are passed verbatim, so a "${...}" token
# is not interpolated — it lands in CMake as a literal bogus path and makes
# find_package(Python) fall back to the wrong interpreter.
