[build-system]
requires = [
#    "cmake>=3.22",
#    "ninja",                # optional but faster on CI
    "pybind11>=2.12",
    "scikit-build-core>=0.9",
    "numpy>=2.3.4",
    "pybind11-stubgen==2.5.5"
]
build-backend = "scikit_build_core.build"

[project]
name = "caset"
version = "0.1.0"
description = "C++/pybind11 extension for lattice spacetime experiments"
authors = [{ name = "Andrew Kelleher", email = "keats.kelleher@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
]
optional-dependencies.examples = [
    "matplotlib>=3.8",
    "scipy>=1.11",
    "tqdm>=4.66",
]
optional-dependencies.dev = [
    "caset[examples]",
    "pytest",
    "scikit-build-core>=0.9",
    "cmake>=3.22",
    "ninja",
    "pybind11>=2.12",
    "pybind11-stubgen==2.5.5",
    "sphinx==8.2.3",
    "furo==2025.9.25",
    "myst_parser==4.0.1",
    "breathe==4.36.0",
    "sphinxcontrib-bibtex>=2.6,<3",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that take >30s (deselect with '-m \"not slow\"')",
]

[tool.scikit-build]
build-dir = "cmake-build-debug/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["caset"]

[tool.scikit-build.cmake.define]
Python_EXECUTABLE = "${python.executable}"
